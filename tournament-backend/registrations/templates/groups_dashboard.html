<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tournament Groups</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0a;
    --surface: #111111;
    --border: #222;
    --accent: #c8a84b;
    --accent-dim: #7a6228;
    --text: #e8e8e8;
    --muted: #555;
    --red: #c84b4b;
    --green: #4bc87a;
    --blue: #4b8ec8;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
  }

  /* Noise texture overlay */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
    pointer-events: none;
    z-index: 0;
    opacity: 0.5;
  }

  header {
    border-bottom: 1px solid var(--border);
    padding: 24px 40px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: relative;
    z-index: 1;
  }

  .logo {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 28px;
    letter-spacing: 4px;
    color: var(--accent);
  }

  .logo span { color: var(--muted); }

  .status-pill {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    padding: 6px 12px;
    border-radius: 2px;
    border: 1px solid var(--border);
    color: var(--muted);
  }

  .status-pill.live { border-color: var(--green); color: var(--green); }
  .status-pill.error { border-color: var(--red); color: var(--red); }

  /* Event tabs */
  .tabs {
    display: flex;
    gap: 2px;
    padding: 24px 40px 0;
    position: relative;
    z-index: 1;
  }

  .tab {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 18px;
    letter-spacing: 3px;
    padding: 12px 28px;
    border: 1px solid var(--border);
    border-bottom: none;
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    transition: all 0.2s;
  }

  .tab:hover { color: var(--text); border-color: #333; }

  .tab.active {
    background: var(--surface);
    color: var(--accent);
    border-color: var(--accent-dim);
  }

  /* Main content */
  .content {
    position: relative;
    z-index: 1;
    padding: 0 40px 60px;
    border-top: 1px solid var(--accent-dim);
    background: var(--surface);
  }

  /* Stats bar */
  .stats-bar {
    display: flex;
    gap: 40px;
    padding: 20px 0;
    border-bottom: 1px solid var(--border);
    margin-bottom: 32px;
  }

  .stat {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .stat-value {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 32px;
    color: var(--accent);
    line-height: 1;
  }

  .stat-label {
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    letter-spacing: 2px;
    color: var(--muted);
    text-transform: uppercase;
  }

  /* Divisions grid */
  .divisions {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
    gap: 20px;
  }

  .division-card {
    border: 1px solid var(--border);
    background: var(--bg);
    animation: fadeUp 0.4s ease both;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .division-header {
    padding: 14px 18px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }

  .division-name {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 15px;
    letter-spacing: 2px;
    color: var(--text);
    line-height: 1.3;
  }

  .division-badge {
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    padding: 4px 8px;
    border-radius: 2px;
    white-space: nowrap;
    flex-shrink: 0;
  }

  .groups-list { padding: 12px; display: flex; flex-direction: column; gap: 10px; }

  .group-block {
    border: 1px solid var(--border);
    overflow: hidden;
  }

  .group-label {
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--muted);
    padding: 6px 12px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .competitor-row {
    display: flex;
    align-items: center;
    padding: 8px 12px;
    gap: 10px;
    border-bottom: 1px solid #161616;
    transition: background 0.15s;
  }

  .competitor-row:last-child { border-bottom: none; }
  .competitor-row:hover { background: #161616; }

  .competitor-num {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    color: var(--muted);
    width: 16px;
    flex-shrink: 0;
  }

  .competitor-name {
    font-size: 13px;
    font-weight: 500;
    flex: 1;
  }

  .competitor-meta {
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    color: var(--muted);
    display: flex;
    gap: 8px;
  }

  .competitor-school {
    font-size: 10px;
    color: var(--muted);
    font-style: italic;
    text-align: right;
    max-width: 120px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  /* Belt color dots */
  .belt-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  /* Empty / loading states */
  .empty-state {
    text-align: center;
    padding: 80px 20px;
    color: var(--muted);
  }

  .empty-state .big {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 48px;
    letter-spacing: 4px;
    display: block;
    margin-bottom: 8px;
    color: #222;
  }

  .loading-bar {
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--accent), transparent);
    animation: slide 1.5s infinite;
    margin-bottom: 32px;
  }

  @keyframes slide {
    from { transform: translateX(-100%); }
    to { transform: translateX(100%); }
  }

  /* Belt colors */
  .belt-white    { background: #e0e0e0; }
  .belt-yellow   { background: #f0d060; }
  .belt-green    { background: #4bc87a; }
  .belt-blue     { background: #4b8ec8; }
  .belt-red      { background: #c84b4b; }
  .belt-black    { background: #888; }
  .belt-black-dan2 { background: #aaa; }
  .belt-black-dan3 { background: #ccc; }

  .school-flag {
    font-size: 9px;
    font-family: 'DM Mono', monospace;
    padding: 2px 5px;
    background: #1a1a1a;
    border: 1px solid var(--border);
    color: var(--muted);
    border-radius: 2px;
    max-width: 100px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .refresh-btn {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    letter-spacing: 1px;
    padding: 8px 16px;
    background: transparent;
    border: 1px solid var(--accent-dim);
    color: var(--accent);
    cursor: pointer;
    transition: all 0.2s;
  }

  .refresh-btn:hover {
    background: var(--accent);
    color: var(--bg);
  }

  .header-right { display: flex; align-items: center; gap: 12px; }
</style>
</head>
<body>

<header>
  <div class="logo">TOURNAMENT <span>/</span> GROUPS</div>
  <div class="header-right">
    <button class="refresh-btn" onclick="loadGroups()">↺ REFRESH</button>
    <div class="status-pill" id="status">LOADING...</div>
  </div>
</header>

<div class="tabs">
  <button class="tab active" onclick="switchTab('sparring', this)">SPARRING</button>
  <button class="tab" onclick="switchTab('poomsae', this)">POOMSAE</button>
  <button class="tab" onclick="switchTab('board_breaking', this)">BOARD BREAKING</button>
</div>

<div class="content">
  <div class="loading-bar" id="loadingBar" style="display:none"></div>

  <div class="stats-bar">
    <div class="stat">
      <span class="stat-value" id="statDivisions">—</span>
      <span class="stat-label">Divisions</span>
    </div>
    <div class="stat">
      <span class="stat-value" id="statCompetitors">—</span>
      <span class="stat-label">Competitors</span>
    </div>
    <div class="stat">
      <span class="stat-value" id="statGroups">—</span>
      <span class="stat-label">Groups</span>
    </div>
  </div>

  <div class="divisions" id="divisionsContainer">
    <div class="empty-state">
      <span class="big">LOADING</span>
      Fetching groups from server...
    </div>
  </div>
</div>

<script>
  const API_BASE = '/api';
  let allData = {};
  let currentTab = 'sparring';

  const BELT_COLORS = {
    'white': 'belt-white',
    'yellow': 'belt-yellow',
    'green': 'belt-green',
    'blue': 'belt-blue',
    'red': 'belt-red',
    'black': 'belt-black',
    'black-dan2': 'belt-black-dan2',
    'black-dan3': 'belt-black-dan3',
  };

  const DIVISION_COLORS = {
    'white':      { bg: '#1a1a14', border: '#3a3820', text: '#d4c870' },
    'yellow':     { bg: '#1a1a14', border: '#3a3820', text: '#d4c870' },
    'green':      { bg: '#0f1a13', border: '#1e3a28', text: '#4bc87a' },
    'blue':       { bg: '#0f1319', border: '#1e2f3a', text: '#4b8ec8' },
    'red':        { bg: '#1a0f0f', border: '#3a1e1e', text: '#c84b4b' },
    'black':      { bg: '#141414', border: '#303030', text: '#aaa' },
    'black-dan2': { bg: '#141414', border: '#303030', text: '#bbb' },
    'black-dan3': { bg: '#141414', border: '#303030', text: '#ccc' },
  };

  async function loadGroups() {
    setLoading(true);
    try {
      const res = await fetch(`${API_BASE}/groups/`);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      allData = await res.json();
      setStatus('live', 'CONNECTED');
      renderTab(currentTab);
    } catch (e) {
      setStatus('error', 'ERROR');
      showError(e.message);
    }
    setLoading(false);
  }

  function switchTab(event, btn) {
    currentTab = event;
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    btn.classList.add('active');
    renderTab(event);
  }

  function renderTab(event) {
    const divisions = allData[event] || [];
    const container = document.getElementById('divisionsContainer');

    if (!divisions.length) {
      container.innerHTML = `
        <div class="empty-state" style="grid-column:1/-1">
          <span class="big">EMPTY</span>
          No competitors registered for this event yet.
        </div>`;
      updateStats(0, 0, 0);
      return;
    }

    let totalCompetitors = 0;
    let totalGroups = 0;

    container.innerHTML = divisions.map((div, di) => {
      totalCompetitors += div.competitor_count;
      totalGroups += div.group_count;
      const belt = div.belt || 'black';
      const colors = DIVISION_COLORS[belt] || DIVISION_COLORS['black'];
      const beltClass = BELT_COLORS[belt] || 'belt-black';

      const groupsHtml = div.groups.map((group, gi) => `
        <div class="group-block">
          <div class="group-label">
            <span>GROUP ${gi + 1}</span>
            <span>${group.length} COMPETITORS</span>
          </div>
          ${group.map((c, ci) => `
            <div class="competitor-row">
              <span class="competitor-num">${ci + 1}</span>
              <div class="belt-dot ${beltClass}"></div>
              <span class="competitor-name">${c.name}</span>
              <div class="competitor-meta">
                <span>${c.age}y</span>
                <span>${c.weight}lb</span>
              </div>
              <span class="school-flag" title="${c.school_name}">${c.school_name}</span>
            </div>
          `).join('')}
        </div>
      `).join('');

      return `
        <div class="division-card" style="animation-delay:${di * 0.05}s; border-color:${colors.border}">
          <div class="division-header" style="background:${colors.bg}; border-color:${colors.border}">
            <div class="division-name" style="color:${colors.text}">${div.division}</div>
            <div class="division-badge" style="background:${colors.bg}; border:1px solid ${colors.border}; color:${colors.text}">
              ${div.competitor_count} ATH
            </div>
          </div>
          <div class="groups-list">${groupsHtml}</div>
        </div>
      `;
    }).join('');

    updateStats(divisions.length, totalCompetitors, totalGroups);
  }

  function updateStats(divisions, competitors, groups) {
    document.getElementById('statDivisions').textContent = divisions;
    document.getElementById('statCompetitors').textContent = competitors;
    document.getElementById('statGroups').textContent = groups;
  }

  function setLoading(on) {
    document.getElementById('loadingBar').style.display = on ? 'block' : 'none';
  }

  function setStatus(type, text) {
    const el = document.getElementById('status');
    el.className = `status-pill ${type}`;
    el.textContent = text;
  }

  function showError(msg) {
    document.getElementById('divisionsContainer').innerHTML = `
      <div class="empty-state" style="grid-column:1/-1">
        <span class="big" style="color:#c84b4b">ERROR</span>
        Could not connect to the backend.<br>
        <span style="font-family:monospace;font-size:12px;color:#c84b4b">${msg}</span><br><br>
        Make sure your Django server is running at <code style="color:#c84b4b">localhost:8000</code>
      </div>`;
    updateStats(0, 0, 0);
  }

  loadGroups();
</script>
</body>
</html>
